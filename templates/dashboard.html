<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ExamGuard Dashboard</title>

    <style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #fff0f5;
        color: #3f2933;
    }

    .header {
        background: #d85a8a;
        color: white;
        padding: 18px 35px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    .header h1 {
        margin: 0;
        font-size: 24px;
        color: white;
    }

    .logout-btn {
        background: #f3d3df;
        color: #8f3159;
        padding: 10px 18px;
        border-radius: 7px;
        text-decoration: none;
        font-weight: bold;
        font-size: 14px;
    }

    .logout-btn:hover {
        background: #eab8cb;
    }

    .container {
        width: 88%;
        max-width: 1100px;
        margin: 35px auto;
    }

    .welcome-box,
    .exam-box {
        background: white;
        border-radius: 12px;
        padding: 28px;
        margin-bottom: 24px;
        box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        border: 1px solid #f3c7d7;
    }

    .welcome-box h2,
    .exam-box h2 {
        color: #b83f70;
        margin-top: 0;
    }

    .welcome-box p,
    .exam-box p {
        color: #6f5a63;
        line-height: 1.6;
        font-size: 16px;
    }

    .exam-box {
        text-align: center;
    }

    .start-btn {
        display: inline-block;
        margin-top: 12px;
        background: #d85a8a;
        color: white;
        padding: 12px 24px;
        border-radius: 7px;
        text-decoration: none;
        font-size: 15px;
        font-weight: bold;
    }

    .start-btn:hover {
        background: #bd4775;
    }

    @media (max-width: 720px) {
        .container {
            width: 94%;
        }

        .header {
            padding: 15px 20px;
        }

        .header h1 {
            font-size: 20px;
        }
    }
</style>
</head>


<body>


    <!-- HEADER -->

    <div class="header">

        <h1>ExamGuard</h1>

        <a href="{{ url_for('logout') }}"
           class="logout-btn">
            Logout
        </a>

    </div>


    <!-- MAIN CONTENT -->

    <div class="container">

    <div class="welcome-box">
        <h2>Welcome to ExamGuard Examination</h2>

        <a href="{{ url_for('start_exam') }}" class="start-btn">
            Start Exam
        </a>
    </div>

    </div>


</body>

</html>
