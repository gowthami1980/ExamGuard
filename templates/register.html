<!DOCTYPE html>
<html>

<head>
    <title>ExamGuard Registration</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Candidate Registration</h1>

    <form method="POST" enctype="multipart/form-data">

        <label>Name</label>
        <input type="text" name="name" required>

        <br><br>

        <label>Email</label>
        <input type="email" name="email" required>

        <br><br>

        <label>Password</label>
        <input type="password" name="password" required>

        <br><br>

        <!-- CAMERA -->

        <h3>Candidate Photo</h3>

        <video
            id="camera"
            autoplay
            playsinline
        ></video>

        <br>

        <!-- START CAMERA -->

        <button
            type="button"
            id="startCamera"
        >
            Start Camera
        </button>

        <!-- CAPTURE PHOTO -->

        <button
            type="button"
            id="capturePhoto"
            disabled
        >
            Capture Photo
        </button>

        <!-- CANVAS -->

        <canvas id="canvas"></canvas>

        <!-- PHOTO PREVIEW -->

        <img
            id="preview"
            alt="Captured Photo"
        >

        <p id="photoStatus"></p>

        <br>

        <!-- REGISTER -->

        <button
            type="submit"
            id="registerButton"
            disabled
        >
            Register
        </button>

    </form>


<script>

    const startCameraButton =
        document.getElementById('startCamera');

    const capturePhotoButton =
        document.getElementById('capturePhoto');

    const registerButton =
        document.getElementById('registerButton');

    const camera =
        document.getElementById('camera');

    const canvas =
        document.getElementById('canvas');

    const photoStatus =
        document.getElementById('photoStatus');

    const preview =
        document.getElementById('preview');

    let cameraStream = null;


    startCameraButton.addEventListener('click', async function() {

        try {

            cameraStream =
                await navigator.mediaDevices.getUserMedia({
                    video: true
                });

            camera.srcObject = cameraStream;

            capturePhotoButton.disabled = false;

            photoStatus.textContent =
                "Camera started. You can capture your photo now.";

        }

        catch(error) {

            console.error(
                "Error accessing camera:",
                error
            );

            photoStatus.textContent =
                "Error accessing camera. Please check your permissions.";
        }

    });


    capturePhotoButton.addEventListener('click', function() {

        canvas.width = camera.videoWidth;
        canvas.height = camera.videoHeight;

        const context =
            canvas.getContext('2d');

        context.drawImage(
            camera,
            0,
            0,
            canvas.width,
            canvas.height
        );

        const imageData =
            canvas.toDataURL('image/jpeg');

        preview.src = imageData;

        preview.style.display = 'block';

        photoStatus.textContent =
            "Photo captured. You can now register.";


        canvas.toBlob(async function(blob) {

            const formData =
                new FormData();

            formData.append(
                'photo',
                blob,
                'photo.jpg'
            );


            try {

                const response =
                    await fetch('/capture-photo', {
                        method: 'POST',
                        body: formData
                    });


                const result =
                    await response.json();


                if (result.success === 'True') {

                    photoStatus.textContent =
                        "Photo uploaded successfully.";

                    registerButton.disabled = false;

                }

                else {

                    photoStatus.textContent =
                        "Photo upload failed: " +
                        result.message;
                }

            }

            catch(error) {

                console.error(
                    "Error uploading photo:",
                    error
                );

                photoStatus.textContent =
                    "Error uploading photo. Please try again.";
            }

        }, 'image/jpeg');

    });

</script>

</body>

</html>
